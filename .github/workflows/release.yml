name: Build and release

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            platform: linux/amd64
            artifact: itt-ocr-linux-amd64
          - name: Windows
            os: windows-latest
            platform: windows/amd64
            artifact: itt-ocr-windows-amd64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Add Go tools to PATH
        if: runner.os == 'Linux'
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Add Go tools to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $goPath = go env GOPATH
          "$goPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            APP_VERSION="$(git describe --tags --always 2>/dev/null | sed 's/^v//' || echo '0.1.3')"
          fi
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w -X itt-ocr/backend/version.Version=${APP_VERSION} -X itt-ocr/backend/version.Commit=${GITHUB_SHA} -X itt-ocr/backend/version.BuildDate=${BUILD_DATE}"
          wails build -clean -platform ${{ matrix.platform }} -ldflags "$LDFLAGS"
          cp build/bin/itt-ocr build/bin/${{ matrix.artifact }}

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows executable and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $appVersion = $env:GITHUB_REF_NAME
          if ($appVersion -match '^v?(.*)$') {
            $appVersion = $matches[1]
          }
          if ($env:GITHUB_REF -notmatch '^refs/tags/') {
            try {
              $describe = git describe --tags --always
              if ($describe -match '^v?(.*)$') {
                $appVersion = $matches[1]
              }
            } catch {
              $appVersion = "0.1.3"
            }
          }
          $buildDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $ldflags = "-s -w -X itt-ocr/backend/version.Version=$appVersion -X itt-ocr/backend/version.Commit=$env:GITHUB_SHA -X itt-ocr/backend/version.BuildDate=$buildDate"
          wails build -clean -nsis -platform ${{ matrix.platform }} -ldflags $ldflags
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Copy-Item build/bin/itt-ocr.exe build/bin/${{ matrix.artifact }}.exe
          $installer = Get-ChildItem build/bin/*-installer.exe | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Installer executable was not created"
            exit 1
          }
          Copy-Item $installer.FullName build/bin/${{ matrix.artifact }}-installer.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/bin/${{ matrix.artifact }}
            build/bin/${{ matrix.artifact }}.exe
            build/bin/${{ matrix.artifact }}-installer.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: itt-ocr-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
