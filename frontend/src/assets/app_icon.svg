<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" shape-rendering="crispEdges">
  <!-- Minimalist European pixel art page outline (Light Mode) -->
  <!-- Top header & dog-ear fold -->
  <rect x="5" y="2" width="9" height="2" fill="#1C1C1A"/>
  <rect x="14" y="4" width="4" height="2" fill="#1C1C1A"/>
  <rect x="14" y="2" width="2" height="2" fill="#6B6B66"/>
  <rect x="16" y="4" width="2" height="2" fill="#6B6B66"/>
  
  <!-- Outer borders -->
  <rect x="4" y="2" width="2" height="20" fill="#1C1C1A"/>
  <rect x="18" y="6" width="2" height="16" fill="#1C1C1A"/>
  <rect x="5" y="20" width="14" height="2" fill="#1C1C1A"/>
  
  <!-- Text lines (pixel dots) -->
  <rect x="8" y="6" width="4" height="1.5" fill="#6B6B66"/>
  <rect x="8" y="9" width="8" height="1.5" fill="#6B6B66"/>
  <rect x="8" y="15" width="8" height="1.5" fill="#6B6B66"/>
  <rect x="8" y="17.5" width="5" height="1.5" fill="#6B6B66"/>

  <!-- Scanning laser beam across page -->
  <rect x="1" y="12" width="22" height="2" fill="#2F6FED"/>
  <rect x="0" y="12.5" width="2" height="1" fill="#5B8DEF"/>
  <rect x="22" y="12.5" width="2" height="1" fill="#5B8DEF"/>
</svg>
